<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vynix Hosting Panel</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f1f5f9; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #334155; }
    .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    nav a { color: var(--muted); margin-left: 20px; text-decoration: none; }
    nav a:hover, nav a.active { color: var(--accent); }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .stat { text-align: center; }
    .stat h3 { font-size: 2rem; color: var(--accent); }
    .stat p { color: var(--muted); }
    button, .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    input, select { background: #0f172a; border: 1px solid #334155; color: var(--text); padding: 8px; border-radius: 6px; width: 100%; margin: 4px 0; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    .error { color: #ef4444; }
    .success { color: #22c55e; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Vynix Hosting Panel</div>
      <nav id="nav" class="hidden">
        <a href="#" onclick="showSection('dashboard')" class="active">Dashboard</a>
        <a href="#" onclick="showSection('servers')">Servers</a>
        <a href="#" onclick="logout()">Logout</a>
      </nav>
    </header>

    <!-- Login -->
    <div id="login-section" class="card">
      <h2>Login</h2>
      <div id="login-error" class="error"></div>
      <form id="login-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden">
      <div class="card">
        <h2>Dashboard</h2>
        <div class="stats" id="stats">
          <div class="stat"><h3 id="total">-</h3><p>Total Servers</p></div>
          <div class="stat"><h3 id="running">-</h3><p>Running</p></div>
          <div class="stat"><h3 id="stopped">-</h3><p>Stopped</p></div>
          <div class="stat"><h3 id="users">-</h3><p>Users</p></div>
        </div>
        <p id="dashboard-note" class="muted" style="margin-top:12px; color:var(--muted);"></p>
      </div>
    </div>

    <!-- Servers -->
    <div id="servers-section" class="hidden">
      <div class="card">
        <h2>Minecraft Servers</h2>
        <button onclick="showCreate()">Create Server</button>
        <div id="create-form" class="hidden" style="margin-top:16px;">
          <input type="text" id="srv-name" placeholder="Server Name" required>
          <select id="srv-software">
            <option value="vanilla">Vanilla</option>
            <option value="paper">Paper</option>
            <option value="purpur">Purpur</option>
            <option value="fabric">Fabric</option>
            <option value="forge">Forge</option>
          </select>
          <input type="text" id="srv-version" placeholder="Minecraft Version (e.g. 1.20.1)" value="1.20.1">
          <input type="number" id="srv-port" placeholder="Port" value="25565">
          <input type="number" id="srv-ram" placeholder="RAM (MB)" value="2048">
          <button onclick="createServer()">Create</button>
        </div>
        <table>
          <thead><tr><th>Name</th><th>Status</th><th>Software</th><th>Version</th><th>Port</th><th>Actions</th></tr></thead>
          <tbody id="servers-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function api(path, opts = {}) {
      const res = await fetch(path, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opts });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const data = await api('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        currentUser = data;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('nav').classList.remove('hidden');
        showSection('dashboard');
      } catch (err) {
        document.getElementById('login-error').textContent = err.message;
      }
    });

    async function logout() {
      await api('/api/logout', { method: 'POST' });
      location.reload();
    }

    function showSection(section) {
      ['dashboard', 'servers'].forEach(s => document.getElementById(s + '-section').classList.add('hidden'));
      document.getElementById(section + '-section').classList.remove('hidden');
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      if (section === 'dashboard') loadDashboard();
      if (section === 'servers') loadServers();
    }

    async function loadDashboard() {
      try {
        const data = await api('/api/dashboard');
        document.getElementById('total').textContent = data.servers.total || 0;
        document.getElementById('running').textContent = data.servers.running || 0;
        document.getElementById('stopped').textContent = data.servers.stopped || 0;
        document.getElementById('users').textContent = data.users || 0;
        document.getElementById('dashboard-note').textContent = data.note || '';
      } catch (e) { console.error(e); }
    }

    async function loadServers() {
      try {
        const servers = await api('/api/servers');
        const tbody = document.getElementById('servers-list');
        tbody.innerHTML = servers.map(s => `
          <tr>
            <td>${s.name}</td>
            <td>${s.status}</td>
            <td>${s.software || '-'}</td>
            <td>${s.version || '-'}</td>
            <td>${s.port || '-'}</td>
            <td><button onclick="alert('Full lifecycle requires Docker node agent')">Manage</button></td>
          </tr>
        `).join('') || '<tr><td colspan="6">No servers yet.</td></tr>';
      } catch (e) { console.error(e); }
    }

    function showCreate() {
      document.getElementById('create-form').classList.toggle('hidden');
    }

    async function createServer() {
      const name = document.getElementById('srv-name').value;
      if (!name) return alert('Name required');
      try {
        await api('/api/servers', {
          method: 'POST',
          body: JSON.stringify({
            name,
            software: document.getElementById('srv-software').value,
            version: document.getElementById('srv-version').value,
            port: parseInt(document.getElementById('srv-port').value),
            ram: parseInt(document.getElementById('srv-ram').value)
          })
        });
        loadServers();
        document.getElementById('create-form').classList.add('hidden');
      } catch (e) { alert(e.message); }
    }

    // Check session on load
    api('/api/me').then(user => {
      currentUser = user;
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('nav').classList.remove('hidden');
      showSection('dashboard');
    }).catch(() => {});
  </script>
</body>
</html>
